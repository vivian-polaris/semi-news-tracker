name: VCP Morning Health Check

on:
  schedule:
    # 每個交易日 08:30 TW (00:30 UTC)，開盤前 30 分鐘自動健檢
    - cron: "30 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        id: check
        run: |
          python scripts/health_check.py 2>&1 | tee /tmp/health_output.txt
          echo "HEALTH_OK=$?" >> $GITHUB_ENV
        shell: bash
        continue-on-error: true

      - name: Create issue if problems found
        if: env.HEALTH_OK != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/health_output.txt', 'utf8');
            const today = new Date(Date.now() + 8*3600000).toISOString().slice(0,10);

            // 避免同一天重複開 issue
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            if (issues.some(i => i.title.includes(today) && i.title.includes('VCP'))) {
              console.log('今日 issue 已存在，跳過');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ VCP 資料異常 ${today}`,
              body: [
                `**自動健康檢查（08:30 TW）發現問題，請在開盤前確認。**`,
                ``,
                `\`\`\``,
                output.trim(),
                `\`\`\``,
                ``,
                `**排查步驟：**`,
                `1. 查看 [GitHub Actions 執行記錄](../../actions/workflows/fetch_daily.yml)`,
                `2. 確認 TWSE/TPEX API 是否可連線`,
                `3. 若資料過舊，手動觸發 [Fetch Daily TWSE Data](../../actions/workflows/fetch_daily.yml)`,
              ].join('\n'),
            });
            console.log(`Issue 已建立：VCP 資料異常 ${today}`);

      - name: Report success
        if: env.HEALTH_OK == '0'
        run: echo "✅ 健康檢查通過，今日開盤前資料正常"
