name: 除息選股 (每3天自動掃描)

on:
  schedule:
    - cron: '0 1 */3 * *'   # 每3天 09:00 台北時間 (UTC+8 = 01:00 UTC)
  workflow_dispatch:          # 允許手動觸發

permissions:
  contents: write

jobs:
  exdiv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright requests

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Step 1 — 抓取 MoneyDJ 除權除息表
        run: python scripts/fetch_moneydj_exdiv.py

      - name: Step 2 — 執行基本面篩選器 (Goodinfo)
        run: python scripts/exdiv_screener.py
        # 若 Goodinfo 被封鎖，部分股票 error 會被跳過，整體仍會輸出結果

      - name: Step 3 — 發送 Email 報告
        run: python scripts/exdiv_email_report.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exdiv_moneydj.json exdiv_screener_results.json || true
          git diff --staged --quiet || git commit -m "auto: exdiv scan $(date -u +%Y-%m-%d)"
          git push || true
