name: Daily VCP Scan

on:
  schedule:
    # 台灣時間週一到週五 16:45（收盤後）= UTC 08:45
    - cron: '45 8 * * 1-5'
  workflow_dispatch:   # 允許手動觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance requests pandas

      - name: Run VCP scan
        run: python scripts/scan_vcp.py

      - name: Commit results
        run: |
          git config user.email "vcpbot@github-actions"
          git config user.name "VCP Scanner Bot"
          git add vcp_daily.json
          git diff --staged --quiet || git commit -m "Daily VCP scan $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
          git push
