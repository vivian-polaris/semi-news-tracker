name: Update Ex-Dividend Data (MoneyDJ)

on:
  schedule:
    # 每3天 台灣時間 10:00（UTC 02:00）
    - cron: "0 2 */3 * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-exdiv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Fetch MoneyDJ ex-dividend data
        run: python scripts/fetch_moneydj_exdiv.py

      - name: Install screener dependencies
        run: pip install requests

      - name: Run ex-div screener (Goodinfo基本面篩選)
        run: python scripts/exdiv_screener.py

      - name: Send Email report
        run: python scripts/exdiv_email_report.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Commit and push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exdiv_moneydj.json exdiv_screener_results.json
          git diff --staged --quiet || git commit -m "data: update exdiv_moneydj from MoneyDJ $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
