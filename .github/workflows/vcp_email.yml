name: VCP Email Report (Manual Test)

on:
  workflow_dispatch:   # 手動觸發，用現有 vcp_daily.json 測試寄信

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send VCP email report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/vcp_email_report.py
