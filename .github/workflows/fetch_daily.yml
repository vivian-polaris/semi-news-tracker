name: Fetch Daily TWSE Data

on:
  schedule:
    # 盤中每 30 分鐘更新（台灣時間 09:00–13:30，UTC 01:00–05:30）
    - cron: "0 1 * * *"   # 09:00 TW
    - cron: "30 1 * * *"  # 09:30 TW
    - cron: "0 2 * * *"   # 10:00 TW
    - cron: "30 2 * * *"  # 10:30 TW
    - cron: "0 3 * * *"   # 11:00 TW
    - cron: "30 3 * * *"  # 11:30 TW
    - cron: "0 4 * * *"   # 12:00 TW
    - cron: "30 4 * * *"  # 12:30 TW
    - cron: "0 5 * * *"   # 13:00 TW
    - cron: "30 5 * * *"  # 13:30 TW 收盤
    # 台灣時間 14:15 (06:15 UTC) — 收盤後 45 分，官方收盤資料已確定
    - cron: "15 6 * * *"  # 14:15 TW
    # 備援：14:45 TW (06:45 UTC) — 若 14:15 TWSE API 尚未更新則此次補抓
    - cron: "45 6 * * *"  # 14:45 TW
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fetch-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance pandas

      - name: Fetch daily data
        run: python scripts/fetch_twse_daily.py

      - name: Commit and push data files
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twse_daily.json stocks_tse.json stocks_otc.json
          git diff --staged --quiet || git commit -m "data: update all data files $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
      # Cloudflare Pages 部署由 deploy.yml (on:push) 自動觸發，此處不重複執行以節省 build 配額
