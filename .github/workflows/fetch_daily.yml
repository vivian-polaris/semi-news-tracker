name: Fetch Daily TWSE Data

on:
  schedule:
    # 盤中每 30 分鐘更新（台灣時間 09:00–13:30，UTC 01:00–05:30）
    - cron: "0 1 * * *"   # 09:00 TW
    - cron: "30 1 * * *"  # 09:30 TW
    - cron: "0 2 * * *"   # 10:00 TW
    - cron: "30 2 * * *"  # 10:30 TW
    - cron: "0 3 * * *"   # 11:00 TW
    - cron: "30 3 * * *"  # 11:30 TW
    - cron: "0 4 * * *"   # 12:00 TW
    - cron: "30 4 * * *"  # 12:30 TW
    - cron: "0 5 * * *"   # 13:00 TW
    - cron: "30 5 * * *"  # 13:30 TW 收盤
    # 台灣時間 14:15 (06:15 UTC) — 收盤後 45 分，官方收盤資料已確定
    - cron: "15 6 * * *"  # 14:15 TW
    # 備援：14:45 TW (06:45 UTC) — 若 14:15 TWSE API 尚未更新則此次補抓
    - cron: "45 6 * * *"  # 14:45 TW
    # 每週一 15:00 TW (07:00 UTC) 自動補充 D1 完整 252 天歷史，確保備援有效
    - cron: "0 7 * * 1"   # 週一 15:00 TW — 週 full sync
  workflow_dispatch:
    inputs:
      full_sync:
        description: '立即補充 D1 完整 252 天歷史（每週一亦自動執行）'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fetch-daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-requests-yfinance-pandas
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install requests yfinance pandas

      - name: Fetch daily data
        env:
          D1_WRITE_SECRET: ${{ secrets.D1_WRITE_SECRET }}
          FULL_SYNC: ${{ (github.event.schedule == '0 7 * * 1') && 'true' || inputs.full_sync || 'false' }}
        run: python scripts/fetch_twse_daily.py

      - name: Commit and push data files
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twse_daily.json stocks_tse.json stocks_otc.json exdiv_2026.json stock_codes.json
          git diff --staged --quiet || git commit -m "data: update all data files $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      # GitHub 安全政策：github-actions[bot] 的 push 不觸發 on:push workflow
      # 因此必須在此直接 deploy，不能依賴 deploy.yml 的 on:push 觸發
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name vivian-vcpfinder --branch main --commit-dirty=true --commit-message="data deploy $(date -u +'%Y-%m-%dT%H:%M')"
