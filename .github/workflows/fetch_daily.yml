name: Fetch Daily TWSE Data

on:
  schedule:
    # 盤中每 30 分鐘更新（台灣時間 09:00–13:30，UTC 01:00–05:30）
    - cron: "0 1 * * *"   # 09:00 TW
    - cron: "30 1 * * *"  # 09:30 TW
    - cron: "0 2 * * *"   # 10:00 TW
    - cron: "30 2 * * *"  # 10:30 TW
    - cron: "0 3 * * *"   # 11:00 TW
    - cron: "30 3 * * *"  # 11:30 TW
    - cron: "0 4 * * *"   # 12:00 TW
    - cron: "30 4 * * *"  # 12:30 TW
    - cron: "0 5 * * *"   # 13:00 TW
    - cron: "30 5 * * *"  # 13:30 TW 收盤
    # 台灣時間 14:15 (06:15 UTC) — 收盤後 45 分，Yahoo Finance 已更新
    - cron: "15 6 * * *"  # 14:15 TW
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch daily data
        run: python scripts/fetch_twse_daily.py

      - name: Commit and push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twse_daily.json stocks_tse.json stocks_otc.json
          git diff --staged --quiet || git commit -m "data: update all data files $(date -u +'%Y-%m-%d')"
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name vivian-vcpfinder --branch main --commit-dirty=true --commit-message="data update ${{ github.sha }}"
