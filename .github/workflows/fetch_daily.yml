name: Fetch Daily TWSE Data

on:
  schedule:
    # 台灣時間 16:45 (08:45 UTC)，每天跑（週末/假日自動用上一交易日資料）
    - cron: "45 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch daily data
        run: python scripts/fetch_twse_daily.py

      - name: Commit and push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twse_daily.json stocks_tse.json stocks_otc.json
          git diff --staged --quiet || git commit -m "data: update all data files $(date -u +'%Y-%m-%d')"
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name vivian-vcpfinder --branch main --commit-dirty=true
