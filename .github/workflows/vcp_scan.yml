name: VCP Daily Scan + Email

on:
  schedule:
    - cron: '0 0 * * 1-5'    # Mon-Fri 00:00 UTC = 08:00 Taipei
    - cron: '30 2 * * 1-5'   # Mon-Fri 02:30 UTC = 10:30 Taipei
    - cron: '0 5 * * 1-5'    # Mon-Fri 05:00 UTC = 13:00 Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet yfinance requests

      - name: Fetch latest market prices
        run: python scripts/fetch_twse_daily.py

      - name: Run VCP scan (reads stocks_tse.json + stocks_otc.json, fetches fundamentals)
        run: python scripts/scan_vcp.py

      - name: Commit vcp_daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vcp_daily.json
          git diff --cached --quiet || git commit -m "data: update vcp_daily.json [skip ci]"
          git push

      - name: Send email report
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          pip install --quiet requests
          python scripts/vcp_email_report.py
