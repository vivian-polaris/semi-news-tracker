name: VCP Daily Scan + Email

on:
  schedule:
    - cron: '0 0 * * 1-5'    # Mon-Fri 00:00 UTC = 08:00 Taipei  (pre-market, uses last close)
    - cron: '45 2 * * 1-5'   # Mon-Fri 02:45 UTC = 10:45 Taipei (15 min after fetch_daily 10:30 commit)
    - cron: '15 5 * * 1-5'   # Mon-Fri 05:15 UTC = 13:15 Taipei (15 min after fetch_daily 13:00 commit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet yfinance requests

      - name: Run VCP scan (reads stocks_tse.json + stocks_otc.json, fetches fundamentals)
        run: python scripts/scan_vcp.py

      - name: Commit vcp_daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vcp_daily.json
          git diff --cached --quiet || git commit -m "data: update vcp_daily.json [skip ci]"
          git push

      - name: Send email report
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          pip install --quiet requests
          python scripts/vcp_email_report.py
