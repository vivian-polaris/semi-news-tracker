name: VCP Daily Scan + Email

on:
  schedule:
    - cron: '0 0 * * 1-5'    # Mon-Fri 00:00 UTC = 08:00 Taipei  (pre-market, yesterday's close — expected)
    - cron: '45 2 * * 1-5'   # Mon-Fri 02:45 UTC = 10:45 Taipei  (intraday, Yahoo Finance data = today)
    - cron: '15 5 * * 1-5'   # Mon-Fri 05:15 UTC = 13:15 Taipei  (near-close, Yahoo Finance data = today)
    - cron: '15 10 * * 1-5'  # Mon-Fri 10:15 UTC = 18:15 Taipei  (post-close backup, TWSE confirmed today)
  workflow_dispatch:

concurrency:
  group: vcp-scan
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet yfinance requests

      - name: Run VCP scan (reads stocks_tse.json + stocks_otc.json, fetches fundamentals)
        id: scan
        run: python scripts/scan_vcp.py

      - name: Commit updated data files
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vcp_daily.json
          git diff --cached --quiet || git commit -m "data: update prices + vcp_daily"
          git pull --rebase origin main
          git push

      - name: Send email report
        if: steps.scan.outcome == 'success'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          pip install --quiet requests
          python scripts/vcp_email_report.py
